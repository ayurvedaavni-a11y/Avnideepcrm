# =====================================================================
# AVNIDEEP CRM PRO — Cloudflare Worker (NEW account only!)
#
# NOTE: This worker + D1 database belong to the NEW Cloudflare account,
# NOT the old store account. Before deploying:
#   1. wrangler login                     (browser login to the NEW account)
#   2. wrangler d1 create avnideep-crm    (prints a database_id)
#   3. paste that database_id below
#   4. wrangler secret put AUTH_SECRET
#      wrangler secret put BOOTSTRAP_KEY
#      wrangler secret put INTAKE_KEY
# Local dev secrets live in worker/.dev.vars (gitignored) — never commit.
# =====================================================================
name = "avnideep-crm-api"
main = "src/index.ts"
# 2026-05-01: works on the current local wrangler runtime AND production
# (was 2026-07-01, which the local runtime rejected — worker could not
# start locally; see audit BUG 4).
compatibility_date = "2026-05-01"
# nodejs_compat: required by web-push (Web Push encryption + https request).
compatibility_flags = ["nodejs_compat"]
account_id = "b47dcac070b4d641981d3e6d9b300294"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "avnideep-crm"
# REPLACE with the database_id printed by: wrangler d1 create avnideep-crm
database_id = "996e0545-5fe2-439f-b4ab-91540f604e57"

[triggers]
# Callback reminder engine — fires due Web Push reminders every minute.
crons = ["* * * * *"]

[vars]
# Local/dev fallbacks only — in production use `wrangler secret put` for these.
PBKDF2_ITERATIONS = "15000"
# VAPID keys for Web Push. Generate with: npx web-push generate-vapid-keys
# NEVER commit the private key — set via `wrangler secret put VAPID_PRIVATE_KEY`.
# Public key is safe to commit (it is exposed to browsers by design).
VAPID_PUBLIC_KEY = "BBkghzRaYVNusAQG4fmOQr5qECBasNpMJXkIXTE316_ES2PL5tzzO9Qp9ptiBOHl1Fzv8esmhkvvybmjvCF8aVo"
VAPID_SUBJECT = "mailto:admin@avnideep.in"
