name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── WORKER: install deps, typecheck, apply D1 migrations, deploy (BUGFIX 4)
  # Previously the Worker was never built/deployed from CI — it only worked
  # when deployed manually. This job makes the API deploy on every push.
  worker:
    runs-on: ubuntu-latest
    # Never block the frontend GitHub Pages deploy on this job.
    # It only deploys the Cloudflare Worker, which needs the
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets —
    # until those are configured the job is skipped/failing but
    # the site still ships. Remove continue-on-error once the
    # secrets are set so CI surfaces worker deploy failures.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Typecheck worker
        working-directory: worker
        run: npx tsc --noEmit
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 execute avnideep-crm --remote --file=./migrations/0001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply incremental migrations (remote, in order)
        working-directory: worker
        run: |
          for f in 0002_perf_indexes.sql 0003_fast_status_sync.sql 0004_enterprise_edit_fields.sql 0005_intake_dedup.sql; do
            echo "→ $f"
            npx wrangler d1 execute avnideep-crm --remote --file=./migrations/$f || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── FRONTEND: build PWA + deploy to GitHub Pages (existing flow)
  # NOTE: intentionally NOT gated on `needs: worker` — the site must
  # always deploy even if the Worker job can't run (missing secrets).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
        env:
          # .env is gitignored, so CI builds never see it. Pass the production
          # API URL explicitly so the bundle never falls back to localhost.
          VITE_API_URL: https://avnideep-crm-api.ayurvedaavni.workers.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
